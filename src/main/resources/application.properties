spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blood_bridge}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.error.include-message=never

# Twilio Comms Email Configuration (Set via Environment Variables in Render / deployment)
twilio.email.enabled=${TWILIO_EMAIL_ENABLED:true}
twilio.email.api-url=${TWILIO_EMAIL_API_URL:https://comms.twilio.com/v1/Emails}
twilio.email.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.email.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.email.from-address=${TWILIO_FROM_ADDRESS:}
twilio.email.from-name=${TWILIO_FROM_NAME:BloodBridge}
twilio.email.trial-fallback=${TWILIO_EMAIL_TRIAL_FALLBACK:true}
