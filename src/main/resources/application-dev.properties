# Local development profile using persistent file-based H2 in MySQL mode
spring.datasource.url=jdbc:h2:file:./data/bloodbridge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


# Sample data seeding for demo / development
bloodbridge.dev.seed-data=true
